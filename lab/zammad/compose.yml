# Zammad lab: contract discovery, and the ticketing and bulk-delete system
# of the lab profile. Daily development uses the recorded fixtures in the
# tests, never this instance.
#
# A pared-down copy of the official zammad-docker-compose (same images and
# version): loopback only, no defaults for passwords, Elasticsearch capped
# at 1 GB, no backup service.
#
# Passwords have no defaults: set them in the environment (Codespaces
# secrets, or ~/.lab.env on your own computer) before `docker compose up`.
# See README.md.
name: supporttoolkit-lab-zammad
# The database lives in ./.data (git-ignored) in the workspace. The search
# index, file storage and caches are named volumes: Zammad rebuilds the
# index from the database, and `lab/up.sh --reset` removes them.

x-zammad: &zammad
  image: ghcr.io/zammad/zammad:7.3.0-0001
  init: true
  restart: unless-stopped
  environment: &zammad-environment
    MEMCACHE_SERVERS: memcached:11211
    POSTGRESQL_HOST: postgresql
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_DB: zammad_production
    POSTGRESQL_USER: zammad
    POSTGRESQL_PASS: ${ZAMMAD_LAB_DB_PASSWORD:?set ZAMMAD_LAB_DB_PASSWORD}
    POSTGRESQL_OPTIONS: "?pool=50"
    POSTGRESQL_DB_CREATE: "false"
    REDIS_URL: redis://redis:6379
    ELASTICSEARCH_ENABLED: "true"
    ELASTICSEARCH_HOST: elasticsearch
    ELASTICSEARCH_PORT: "9200"
    ELASTICSEARCH_SCHEMA: http
    NGINX_PORT: "8080"
    ZAMMAD_HTTP_TYPE: http
    ZAMMAD_FQDN: localhost:8100
    TZ: Europe/Copenhagen
  volumes:
    - storage:/opt/zammad/storage
  depends_on:
    memcached:
      condition: service_healthy
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # The zammad-* names are the official ones: the nginx and websocket
  # entrypoints find the other services by these names.
  zammad-init:
    <<: *zammad
    command: ["zammad-init"]
    restart: on-failure
    user: 0:0

  zammad-railsserver:
    <<: *zammad
    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5

  zammad-scheduler:
    <<: *zammad
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad
    command: ["zammad-websocket"]

  zammad-nginx:
    <<: *zammad
    command: ["zammad-nginx"]
    init: false
    ports:
      - "127.0.0.1:8100:8080"
    depends_on:
      zammad-railsserver:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Capped: uncapped, Elasticsearch takes half of the machine's memory.
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - search:/usr/share/elasticsearch/data

  memcached:
    image: memcached:1.6.45-alpine
    command: memcached -m 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      retries: 5

  redis:
    image: redis:8.12-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  postgresql:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      # The image's bootstrap role is a superuser; Zammad gets its own,
      # unprivileged role and database from the init script below.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZAMMAD_LAB_DB_PASSWORD:?set ZAMMAD_LAB_DB_PASSWORD}
      ZAMMAD_DB: zammad_production
      ZAMMAD_DB_USER: zammad
      ZAMMAD_DB_PASS: ${ZAMMAD_LAB_DB_PASSWORD:?set ZAMMAD_LAB_DB_PASSWORD}
    configs:
      - source: create-zammad-role
        target: /docker-entrypoint-initdb.d/10-create-zammad-role.sh
        mode: 0555
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${ZAMMAD_DB_PASS}" psql --no-password --quiet --output /dev/null --host 127.0.0.1 --username "$${ZAMMAD_DB_USER}" --dbname "$${ZAMMAD_DB}" --command "SELECT 1"
      interval: 10s
      start_period: 60s
      retries: 10
    volumes:
      - ./.data/postgresql:/var/lib/postgresql/data

configs:
  create-zammad-role:
    content: |
      #!/bin/bash
      set -o errexit -o pipefail
      psql --variable ON_ERROR_STOP=1 --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" \
           --variable role="$${ZAMMAD_DB_USER}" --variable pass="$${ZAMMAD_DB_PASS}" \
           --variable db="$${ZAMMAD_DB}" <<'EOSQL'
      CREATE ROLE :"role" LOGIN PASSWORD :'pass';
      CREATE DATABASE :"db" OWNER :"role";
      EOSQL

volumes:
  storage:
  search:
  redis:
