name: CI

on:
  push:
    branches:
      - main
      - build/github-actions-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SupportToolkit.slnx

      - name: Build
        run: dotnet build SupportToolkit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SupportToolkit.slnx --configuration Release --no-build --no-restore
