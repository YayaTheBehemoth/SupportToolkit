
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Package and publish (Windows)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, test and package
        shell: cmd
        run: call scripts\publish-windows.cmd

      - name: Verify ZIP extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = 'artifacts/SupportToolkit-win-x64.zip'
          $destination = 'artifacts/release-validation'

          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Release ZIP was not created."
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force -ErrorAction Stop

          $executable = Join-Path $destination 'SupportToolkit.exe'
          $fixtures = Join-Path $destination 'Fixtures/Acronis'

          if (-not (Test-Path $executable -PathType Leaf)) {
            throw "SupportToolkit.exe is missing from the extracted package."
          }

          if (-not (Test-Path $fixtures -PathType Container)) {
            throw "Acronis fixtures are missing from the extracted package."
          }

          Write-Host "ZIP extraction succeeded."
          Write-Host "Executable and fixtures verified."

      - name: Verify executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Join-Path (Get-Location) 'artifacts/release-validation/SupportToolkit.exe'

          & $exe --help

          if ($LASTEXITCODE -ne 0) {
            throw "Published executable failed its startup check."
          }

          Write-Host "Executable startup verified."

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/SupportToolkit-win-x64.zip" `
            --verify-tag `
            --title "SupportToolkit $env:RELEASE_TAG" `
            --notes "Portable Windows x64 build. Extract the ZIP and run SupportToolkit.exe." `
            --prerelease
